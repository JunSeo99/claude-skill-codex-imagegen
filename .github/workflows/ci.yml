name: Skill CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-package:
    name: Security and package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run skill, security, alpha, and bundle tests
        run: python -m unittest discover -s tests -v

      - name: Verify reproducible skill bundle
        run: python scripts/package_skill.py --check

      - name: Check command help without network access
        run: |
          python skill/scripts/run_codex_imagegen.py --help
          python skill/scripts/verify_png_alpha.py --help
